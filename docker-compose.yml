
services:
  api:
    build: .
    ports:
      - '8000:8000'
    volumes:
      - ./src:/app/src:ro
      - ./data:/app/data
      - ../resource:/app/data/resource:ro
    environment:
      - DATABASE_URL=sqlite:///./data/store_intelligence.db
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
